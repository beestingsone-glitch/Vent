<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Web Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />

    <title>Vent | Let it out. Let it vanish.</title>
    <meta name="description" content="Vent — Anonymous real-time encrypted messaging, self-destructing chats, and voice/video calling." />
    <meta property="og:title" content="Vent | Let it out. Let it vanish." />
    <meta property="og:description" content="Anonymous real-time encrypted messaging, self-destructing chats, and voice/video calling." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Inline Service Worker Registration for PWABuilder & Offline PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
